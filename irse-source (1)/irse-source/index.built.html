<!DOCTYPE html>
<html lang="ar" dir="rtl">
<!--
=====================================================================
 شجرة المواد التفاعلية – الجامعة الأميركية في مادبا (AUM)
 ملف واحد بلغتين (عربي / English) | دخول طالب + لوحة مدير
=====================================================================
 الملفات (كلها بنفس المجلد):
   1) index.html   ← هذا الملف
   2) aum_logo.png ← شعار الجامعة (اختياري، إذا مش موجود بيختفي مكانه)
   3) data.json    ← اختياري: بيتولّد من لوحة المدير ← البيانات ← تصدير الخطط
                     وبيخلي كل الطلاب يشوفوا نفس التخصصات والمواد.

 المدير:  admin / admin123   (غيّر كلمة المرور من لوحة المدير)

 الأوضاع: 🌳 شجرة (أغصان = سنوات، ثمار = مواد)
          🏢 عمارة (طابق = سنة، شباك = مادة)
          🌊 بحر  (عمق = سنة، سمكة = مادة)
          📋 خطة  (الشكل الأصلي مع خطوط الربط)

 ملاحظة: التخزين على متصفح كل مستخدم (localStorage). بدون سيرفر، حسابات الطلاب
 وتقدمهم بتضل على جهازهم. للمزامنة بين الأجهزة لازم قاعدة بيانات.
=====================================================================
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AUM – Interactive Course Map</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--m:#800020;--md:#580016;--g:#d4af37;--gl:#f3e5ab;--ac:#800020;--bg:#f7f5f2;--card:#fff;--bd:#d9d3cc;--ok:#16a34a;--tx:#1e293b;--mu:#64748b;--col:#fff;--lock:#f1f5f9;--done:#f0fdf4;--bad:#dc2626;--sh:0 8px 28px rgba(40,25,10,.14);--lb:#163a21;--sky1:#d6e9df;--sky2:#eef1e2;--sky3:#cdb98f;--bsky1:#bfdcf0;--bsky2:#eaf3f8}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--bd:#475569;--tx:#e2e8f0;--mu:#94a3b8;--col:#172033;--lock:#182235;--done:#0f2a1c;--ok:#4ade80;--ac:#f0a5b5;--sh:0 8px 28px rgba(0,0,0,.45);--lb:#e6f3e8;--sky1:#0e2233;--sky2:#13301f;--sky3:#2b2413;--bsky1:#0c1424;--bsky2:#1b2a44}}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',system-ui,sans-serif}
body{background:var(--bg);color:var(--tx);min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;font-weight:700;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--g);outline-offset:2px}

/* ---------- الهيدر والأزرار ---------- */
.top{background:linear-gradient(135deg,var(--md),var(--m));color:#fff;padding:14px 22px;border-bottom:4px solid var(--g);margin-bottom:18px}
.hc{max-width:1400px;margin:auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px}
.top h1{font-size:1.3rem;font-weight:800;line-height:1.3}
.sub{font-size:.88rem;color:var(--gl)}
.brand{display:flex;align-items:center;gap:14px}
.logo{background:#fff;padding:6px 12px;border-radius:12px;display:flex}
.logo img{max-height:46px;width:auto;display:block}
.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{background:var(--g);color:var(--md);padding:8px 16px;border-radius:9px;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn-m{background:var(--m);color:#fff}
.btn-o{background:transparent;color:var(--ac);border:2px solid var(--ac)}
.btn-d{background:var(--bad);color:#fff}
.btn-w{background:rgba(255,255,255,.16);color:#fff}
.btn-s{padding:4px 11px;font-size:.84rem;border-radius:8px}
.pw{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);padding:7px 14px;border-radius:10px;border:1px solid rgba(212,175,55,.4)}
.pb{width:130px;height:12px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden}
#pf{height:100%;width:0;background:var(--g);transition:width .4s}
.modes{display:flex;gap:4px;background:rgba(255,255,255,.12);padding:4px;border-radius:12px}
.modes button{padding:6px 13px;border-radius:9px;color:#fff;font-size:.92rem}
.modes button[aria-pressed=true]{background:var(--g);color:var(--md)}
.banner{background:var(--gl);color:var(--md);text-align:center;font-weight:700;padding:8px 14px;margin:-18px 0 18px;font-size:.9rem}
.legend{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-size:.86rem;color:var(--mu);margin:0 16px 16px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:50%;margin-inline-end:6px;vertical-align:-2px;box-shadow:inset -2px -2px 0 rgba(0,0,0,.18)}
.stage{padding:0 12px 48px}
.scene{max-width:1180px;margin:0 auto;border-radius:22px;position:relative;overflow:hidden;box-shadow:var(--sh)}
.empty{color:var(--mu);text-align:center;padding:18px;font-size:.9rem;width:100%}
.hl-pre{outline:3px dashed var(--g);outline-offset:3px;border-radius:14px}
.hl-dep{outline:3px solid rgba(128,0,32,.65);outline-offset:3px;border-radius:14px}
[data-id].n-lock{cursor:not-allowed}

/* ---------- وضع الشجرة ---------- */
.tree{background:linear-gradient(var(--sky1) 0%,var(--sky2) 62%,var(--sky3) 100%)}
.crown{display:flex;justify-content:center;padding-top:22px}
.crown span{width:92px;height:74px;display:grid;place-items:center;font-size:2.1rem;background:radial-gradient(circle at 40% 35%,#5aa06a,#2f6b3f);border-radius:50% 50% 46% 46%;box-shadow:0 6px 0 rgba(0,0,0,.14)}
.tr-rows{--tw:84px;position:relative;padding:0 16px;margin-top:-6px}
.trunk{position:absolute;inset-block:0;left:50%;width:var(--tw);transform:translateX(-50%);background:repeating-linear-gradient(90deg,#4a2f1a 0 6px,#5b3b22 6px 14px,#7a5230 14px 20px,#5b3b22 20px 30px)}
.lr{display:grid;grid-template-columns:1fr var(--tw) 1fr;direction:ltr;position:relative}
.lr.L .cell{grid-column:1}
.lr.R .cell{grid-column:3}
html[dir=rtl] .cell{direction:rtl}
html[dir=ltr] .cell{direction:ltr}
.cell{position:relative;padding-top:34px;margin-bottom:8px}
.limb{position:absolute;top:12px;height:24px;width:calc(100% + 28px);border-radius:24px;background:linear-gradient(#8a6035,#5b3b22);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.lr.L .limb{right:-28px;transform-origin:right center;transform:rotate(1.6deg)}
.lr.R .limb{left:-28px;transform-origin:left center;transform:rotate(-1.6deg)}
.ytag{position:absolute;top:0;z-index:2;background:var(--g);color:var(--md);font-weight:800;padding:3px 16px;border-radius:999px;box-shadow:0 2px 0 rgba(0,0,0,.2);font-size:.92rem}
.lr.L .ytag{left:14px}
.lr.R .ytag{right:14px}
.canopy{position:relative;margin-top:-4px;background:radial-gradient(ellipse at 50% 0,rgba(78,146,92,.62),rgba(58,116,72,.46));border-radius:30px;padding:26px 10px 14px;display:flex;flex-wrap:wrap;justify-content:center;gap:14px 4px}
.fr{width:92px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 4px;border-radius:12px;text-align:center;color:var(--lb)}
.fruit{position:relative;width:40px;height:40px;border-radius:50% 50% 46% 46%;box-shadow:inset -4px -5px 0 rgba(0,0,0,.14),0 3px 0 rgba(0,0,0,.14);display:grid;place-items:center;color:#5a4300;font-weight:800;font-size:1.05rem;transition:translate .15s}
.fruit::before{content:'';position:absolute;top:-10px;left:50%;width:2px;height:10px;background:#5b3b22;transform:translateX(-50%)}
.fruit::after{content:'';position:absolute;top:-9px;left:52%;width:15px;height:8px;border-radius:0 100% 0 100%;background:#3f8f4d;transform:rotate(-12deg)}
.fr:hover .fruit{translate:0 2px}
.n-lock .fruit{background:radial-gradient(circle at 35% 30%,#c4dca8,#7ea25c 65%,#5e8442)}
.n-open .fruit{background:radial-gradient(circle at 35% 30%,#ff8686,#c0162f 62%,#82101f)}
.n-done .fruit{background:radial-gradient(circle at 35% 30%,#fff0ac,#d4af37 62%,#a8841b)}
.fc{font-size:.68rem;font-weight:800;opacity:.8}
.fn{font-size:.76rem;font-weight:700;line-height:1.25}
.n-lock.fr{opacity:.78}
.tr-base{height:36px;display:flex;justify-content:center;margin-top:-2px}
.tr-base::before{content:'';width:190px;height:36px;background:#5b3b22;clip-path:polygon(38% 0,62% 0,100% 100%,0 100%)}
.grass{background:linear-gradient(#6fa561,#4d8748);padding:18px 16px 26px;text-align:center;color:#fff}
.grass.thin{padding:0;height:26px}
.grass h3{font-size:1.05rem;font-weight:800}
.grass p{font-size:.86rem;opacity:.92;margin:2px 0 14px}
.fallen{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pill{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.93);color:#2b3a20;border-radius:999px;padding:6px 14px 6px 10px;font-size:.84rem;font-weight:700}
.dot{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8686,#c0162f 65%);flex:none}
.pill.n-done{background:rgba(255,247,214,.95);text-decoration:line-through}
.pill.n-done .dot{background:radial-gradient(circle at 35% 30%,#fff0ac,#d4af37 65%)}
@media (max-width:720px){
  .tr-rows{padding:0 10px 0 10px}
  .trunk{left:auto;inset-inline-start:10px;width:30px;transform:none}
  .lr{grid-template-columns:44px 1fr;direction:inherit}
  .lr.L .cell,.lr.R .cell{grid-column:2}
  .lr.L .limb,.lr.R .limb{left:auto;right:auto;inset-inline-start:-38px;width:48px;height:18px;top:16px;transform:none;border-radius:10px}
  .lr.L .ytag,.lr.R .ytag{left:auto;right:auto;inset-inline-start:14px}
  .tr-base::before{width:120px}
}

/* ---------- وضع العمارة ---------- */
.bld{background:linear-gradient(var(--bsky1),var(--bsky2));padding:22px 12px 0}
.bld-in{max-width:980px;margin:0 auto}
.roof{height:76px;background:linear-gradient(#7a1226,var(--m));clip-path:polygon(5% 100%,12% 0,88% 0,95% 100%);display:grid;place-items:center;color:#fff;font-weight:800;text-align:center;padding:10px 12% 0;font-size:1.05rem;border-bottom:6px solid var(--g)}
.facade{background:linear-gradient(#e4d8c1,#d6c6a8);border-inline:10px solid #c4b291}
.floor{display:grid;grid-template-columns:92px 1fr;border-bottom:8px solid #b9a582;background:repeating-linear-gradient(0deg,rgba(0,0,0,.04) 0 2px,transparent 2px 44px)}
.fl-num{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#c9b794;color:var(--md);border-inline-end:6px solid #b9a582;padding:6px 4px;text-align:center}
.fl-num b{font-size:2.1rem;line-height:1;font-weight:800}
.fl-num small{font-size:.72rem;font-weight:700;line-height:1.2}
.wins{display:flex;flex-wrap:wrap;gap:14px 12px;padding:16px 12px 18px;justify-content:center}
.win{position:relative;width:120px;min-height:94px;border-radius:9px 9px 3px 3px;border:6px solid #f4eee2;box-shadow:0 0 0 2px #b9a582,0 7px 0 #c0ad8a;padding:8px 6px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;text-align:center;overflow:hidden}
.win::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.26) 0 16%,transparent 16% 28%,rgba(255,255,255,.13) 28% 36%,transparent 36%)}
.win .fc{font-size:.68rem;font-weight:800;opacity:.85}
.win .fn{font-size:.78rem;font-weight:700;line-height:1.25}
.win.n-lock{background:linear-gradient(160deg,#2a394f,#141d2c);color:#94a3ba}
.win.n-open{background:linear-gradient(160deg,#d3eafa,#8fbfe3);color:#0d2b45}
.win.n-done{background:linear-gradient(160deg,#ffeaa9,#f4b942);color:#4a2b00;box-shadow:0 0 0 2px #b9a582,0 7px 0 #c0ad8a,0 0 22px rgba(244,185,66,.75)}
.win.n-done::before{content:'✓';position:absolute;top:1px;inset-inline-end:6px;font-weight:800;z-index:1}
.ground{background:linear-gradient(#a99674,#8e7b5a);padding:20px 14px 26px;text-align:center;color:#fff;border-top:8px solid #7c6a4b}
.ground h3{font-size:1.05rem;font-weight:800}
.ground p{font-size:.86rem;opacity:.92;margin:2px 0 14px}
.doors{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.door{width:106px;min-height:122px;border-radius:53px 53px 4px 4px;padding:34px 8px 10px;font-size:.78rem;font-weight:700;line-height:1.25;display:flex;align-items:center;justify-content:center;text-align:center;border:4px solid #4a2b14}
.door.n-open{background:linear-gradient(#80502c,#5a3419);color:#f7ecd8}
.door.n-done{background:linear-gradient(#ffeaa9,#f4b942);color:#4a2b00;box-shadow:0 0 20px rgba(244,185,66,.7)}
.door.n-done::before{content:'✓ '}
@media (max-width:720px){.floor{grid-template-columns:58px 1fr}.fl-num b{font-size:1.5rem}.fl-num small{font-size:.6rem}.win{width:104px}.roof{font-size:.9rem;padding-inline:8%}}

/* ---------- وضع البحر ---------- */
.sea{background:#06263f}
.surface{height:58px;background:linear-gradient(#cdeef4,#86d6e2);position:relative;overflow:hidden}
.surface svg{position:absolute;bottom:-1px;left:0;width:100%;height:36px}
.zone{--i:0;--l1:max(12%,calc(62% - var(--i)*9%));--l2:max(12%,calc(62% - (var(--i) + 1)*9%));position:relative;padding:18px 14px 26px;color:var(--tc,#eaf6ff);background:linear-gradient(hsl(calc(190 + var(--i)*7) 72% var(--l1)),hsl(calc(190 + (var(--i) + 1)*7) 72% var(--l2)))}
.zone h3{font-size:1.02rem;font-weight:800;text-align:center;margin-bottom:12px}
.fishes{display:flex;flex-wrap:wrap;gap:12px 8px;justify-content:center;position:relative;z-index:1}
.fs{width:104px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:14px;text-align:center;color:var(--tc,#eaf6ff)}
.fsh{width:66px;height:37px;transition:translate .2s,filter .2s}
.flip .fsh{transform:scaleX(-1)}
.fs:hover .fsh{translate:0 -4px}
.n-lock .fsh{color:#6f8298;opacity:.62}
.n-open .fsh{color:#ff8a5c}
.n-done .fsh{color:#f6c324;filter:drop-shadow(0 0 7px rgba(246,195,36,.85))}
.fs .fc{font-size:.68rem;font-weight:800;opacity:.85}
.fs.n-done .fc::before{content:'✓ '}
.fs .fn{font-size:.76rem;font-weight:700;line-height:1.25}
.bubs{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bub{position:absolute;bottom:-24px;border-radius:50%;border:2px solid rgba(255,255,255,.38);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-1400px);opacity:0}}
.seabed{background:linear-gradient(#0c2c3f,#8d8a6a 92%,#c9b27a);padding:22px 14px 30px;position:relative;text-align:center;color:#eaf6ff}
.seabed h3{font-size:1.05rem;font-weight:800}
.seabed p{font-size:.86rem;opacity:.9;margin:2px 0 14px}
.shells{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;background:rgba(3,25,40,.55);border-radius:18px;padding:14px}
.shell{width:98px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#eaf6ff;font-size:.76rem;font-weight:700;line-height:1.25;padding:4px}
.shell span.s{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3)}
.shell.n-done span.s{background:rgba(246,195,36,.35);border-color:#f6c324;box-shadow:0 0 14px rgba(246,195,36,.7)}
.shell.n-done b::before{content:'✓ '}
@media (prefers-reduced-motion:reduce){.bub{animation:none;opacity:0}}

/* ---------- الوضع الكلاسيكي (الخطة) ---------- */
.scroll{overflow-x:auto;padding:0 4px}
#vp{position:relative;min-width:calc(var(--yn,5)*230px);max-width:1600px;margin:auto;padding:10px}
#svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.yrs{display:grid;grid-template-columns:repeat(var(--yn,5),1fr);gap:16px;position:relative;z-index:2;align-items:start}
.yc{background:var(--col);border:2px solid var(--bd);border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;gap:12px}
.yh{text-align:center;padding:10px 4px;background:var(--m);color:#fff;border-radius:10px;font-weight:800;border-bottom:3px solid var(--g)}
.cc{text-align:start;width:100%;background:var(--card);color:var(--tx);border:2px solid var(--m);border-radius:12px;padding:10px 12px;font-weight:400;transition:transform .2s,border-color .2s}
.cc:hover{transform:translateY(-2px);border-color:var(--g)}
.cc.n-done{background:var(--done);border-color:var(--ok)}
.cc.n-done .c,.cc.n-done .t{text-decoration:line-through}
.cc.n-done .t{color:var(--mu)}
.cc.n-lock{opacity:.55;background:var(--lock);border-color:var(--bd);transform:none}
.cc .c{font-size:.78rem;font-weight:800;color:var(--ac)}
.cc.n-done .c{color:var(--ok)}
.cc .t{font-size:.88rem;font-weight:700;line-height:1.3}
.cc .p{font-size:.72rem;color:#d97706;margin-top:5px;font-weight:600}
.gs{margin:32px auto 0;max-width:1400px;width:calc(100% - 8px);background:var(--col);border:2px dashed var(--m);border-radius:18px;padding:24px;text-align:center}
.gs h2{color:var(--ac);font-size:1.3rem;font-weight:800}
.gs p{color:var(--mu);margin:6px 0 16px}
.st{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{background:var(--card);color:var(--ac);border:2px solid var(--m);border-radius:30px;padding:8px 16px;font-size:.88rem}
.chip:hover{background:var(--gl);color:var(--md);border-color:var(--g)}
.chip.n-done{background:#dcfce7;border-color:var(--ok);color:#166534;text-decoration:line-through}
#svg path{fill:none;stroke:var(--bd);stroke-width:2.5}
#svg path.ready{stroke:var(--m);stroke-width:3;stroke-dasharray:6 4}
#svg path.active{stroke:var(--ok);stroke-width:3.5}

/* ---------- شاشة الدخول ---------- */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,var(--md),var(--m));position:relative}
.auth-lang{position:absolute;top:16px;inset-inline-end:16px}
.auth-card{width:min(450px,100%);background:var(--card);border-radius:20px;padding:26px 26px 24px;box-shadow:0 24px 64px rgba(0,0,0,.4);border-top:5px solid var(--g)}
.auth-brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.auth-brand h1{font-size:1.35rem;font-weight:800;color:var(--ac)}
.auth-brand p{color:var(--mu);font-size:.9rem}
.tabs{display:flex;background:var(--lock);border-radius:12px;padding:4px;margin:18px 0;gap:4px}
.tabs button{flex:1;padding:9px 12px;border-radius:9px;color:var(--mu)}
.tabs button[aria-selected=true]{background:var(--card);color:var(--ac);box-shadow:0 1px 5px rgba(0,0,0,.18)}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fld label{font-weight:700;font-size:.88rem}
.fld input,.fld select{padding:10px 12px;border:2px solid var(--bd);border-radius:10px;background:var(--card);width:100%}
.fld input:focus,.fld select:focus{border-color:var(--g)}
.fld small{color:var(--mu);font-size:.8rem}
.err{color:var(--bad);font-size:.88rem;min-height:1.3em;margin-bottom:8px;font-weight:700}
.full{width:100%;padding:11px}
.link{color:var(--ac);text-decoration:underline;padding:0;font-weight:700}
.swap{text-align:center;margin-top:14px;font-size:.9rem;color:var(--mu)}

/* ---------- لوحة المدير ---------- */
.adm{max-width:1200px;margin:0 auto;padding:0 16px 56px}
.adm .tabs{margin-top:0;overflow-x:auto}
.adm .tabs button{white-space:nowrap}
.bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.bar h2{font-size:1.2rem;color:var(--ac)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row select,.row input{padding:8px 12px;border:2px solid var(--bd);border-radius:10px;background:var(--card)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.panel,.mcard{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px}
.mcard h3{font-size:1.05rem;color:var(--ac)}
.mcard .mu,.mu{color:var(--mu);font-size:.85rem}

<script>
/* ===== 0) إعدادات المدير =====
   الدخول الافتراضي:  اسم المستخدم admin  |  كلمة المرور admin123
   غيّر كلمة المرور من لوحة المدير ← البيانات ← تغيير كلمة مرور المدير، وانسخ السطر الناتج مكان ADMIN_HASH.
   تنبيه أمني: هذا الموقع ملف ثابت بدون سيرفر، فالتحقق من كلمة المرور بيصير داخل المتصفح.
   هذا مناسب للاستعمال الداخلي والعرض، لكنه مش حماية حقيقية ضد شخص يعرف يفتح أدوات المطوّر.
   للحماية الحقيقية وحسابات مشتركة بين الأجهزة لازم قاعدة بيانات على سيرفر (Firebase / Supabase). */
const ADMIN_USER='admin';
const ADMIN_HASH='89564710911a976c59d63ec56520b636dbade35d7be97d619691a0dd8e9dd07b'; // sha256('aum|admin|admin123')
/* SHA-256 (JS صرف، بيشتغل حتى على http عادي) */
function sha256(str){
  const ascii=String.fromCharCode(...new TextEncoder().encode(str));
  const rr=(v,a)=>(v>>>a)|(v<<(32-a));
  const mp=Math.pow,mw=mp(2,32);let result='',i,j;
  const words=[],bitLen=ascii.length*8;
  const K=[],H0=[],comp={};
  for(let c=2,pc=0;pc<64;c++){if(!comp[c]){for(i=0;i<313;i+=c)comp[i]=c;H0[pc]=(mp(c,.5)*mw)|0;K[pc++]=(mp(c,1/3)*mw)|0}}
  let a2=ascii+'\x80';while(a2.length%64-56)a2+='\x00';
  for(i=0;i<a2.length;i++){words[i>>2]|=a2.charCodeAt(i)<<((3-i)%4)*8}
  words[words.length]=(bitLen/mw)|0;words[words.length]=bitLen;
  let hash=H0.slice(0,8);

/* تنظيف أي بيانات جاية من ملف أو استيراد قبل ما نستعملها */
function sanitize(d){
  const s=v=>String(v??'').slice(0,200);
  const hrs=v=>{const n=parseInt(v);return n>=0&&n<=12?n:3};
  let faculties=(Array.isArray(d&&d.faculties)?d.faculties:[]).filter(f=>f&&f.id).map(f=>({id:s(f.id),uid:s(f.uid),ar:s(f.ar),en:s(f.en)}));
  const rawMajors=(Array.isArray(d&&d.majors)?d.majors:[]).filter(m=>m&&m.id);
  // بيانات قديمة بدون كليات: منعمل كلية افتراضية ونحط فيها كل الأقسام
  if(!faculties.length&&rawMajors.length)faculties=[{id:'f_eng',uid:'',ar:'كلية الهندسة',en:'Faculty of Engineering'}];
  let universities=(Array.isArray(d&&d.universities)?d.universities:[]).filter(u=>u&&u.id).map(u=>({id:s(u.id),ar:s(u.ar),en:s(u.en)}));
  if(!universities.length&&faculties.length)universities=[{id:'u_aum',ar:'الجامعة الأميركية في مادبا',en:'American University of Madaba'}];
  const uids=new Set(universities.map(u=>u.id));
  faculties.forEach(f=>{if(!uids.has(f.uid))f.uid=universities[0].id});
  const fids=new Set(faculties.map(f=>f.id));
  const majors=rawMajors.map(m=>{
    const years=Math.min(8,Math.max(1,parseInt(m.years)||5));
    const seen=new Set();
    const courses=(Array.isArray(m.courses)?m.courses:[]).filter(c=>c&&c.id&&!seen.has(String(c.id))&&seen.add(String(c.id)))
      .map(c=>({id:s(c.id),y:Math.min(years,Math.max(1,parseInt(c.y)||1)),h:hrs(c.h),ar:s(c.ar),en:s(c.en),pre:Array.isArray(c.pre)?c.pre.map(s):[]}));
    const ids=new Set(courses.map(c=>c.id));
    courses.forEach(c=>{c.pre=c.pre.filter(p=>ids.has(p)&&p!==c.id)});
    const electives=(Array.isArray(m.electives)?m.electives:[]).filter(e=>e&&e.id).map(e=>({id:s(e.id),h:hrs(e.h),ar:s(e.ar),en:s(e.en)}));
    return{id:s(m.id),fid:fids.has(m.fid)?m.fid:faculties[0].id,ar:s(m.ar),en:s(m.en),years,courses,electives};
  });
  return{rev:+(d&&d.rev)||0,universities,faculties,majors};
}

/* ===== 5) منطق عرض الخطة (مشترك بين الأوضاع الأربعة) ===== */
function startViewer(major,done,commit,meta){
  V={major,done,commit,meta,
    byId:Object.fromEntries(major.courses.map(c=>[c.id,c])),
    eById:Object.fromEntries(major.electives.map(e=>[e.id,e]))};
}
// المادة مفتوحة إذا كل متطلباتها مشطوبة
const isOpen=c=>c.pre.every(p=>!V.byId[p]||V.done.includes(p));
const stOf=c=>V.done.includes(c.id)?'done':isOpen(c)?'open':'lock';
const kids=id=>V.major.courses.filter(c=>c.pre.includes(id)).map(c=>c.id);
// إلغاء شطب مادة + كل المواد اللي بتعتمد عليها
function drop(id){V.done=V.done.filter(x=>x!==id);kids(id).forEach(k=>{if(V.done.includes(k))drop(k)})}
const snap=()=>new Set(V.major.courses.filter(c=>stOf(c)==='open').map(c=>c.id));
function toggle(id){
  const c=V.byId[id],e=V.eById[id];
  if(!c&&!e)return;
  const before=snap(),was=V.done.includes(id);
  if(was)drop(id);
  else if(!c||isOpen(c))V.done.push(id);
  else{toast(t('needPre',c.pre.filter(p=>V.byId[p]&&!V.done.includes(p)).map(p=>nm(V.byId[p]))));return}
  V.commit();stage();
  // تأثيرات الحركة: المادة اللي انضغطت + المواد اللي انفتحت بسببها
  fx(id,was?'fx-off':'fx-on',[...snap()].filter(x=>!before.has(x)&&x!==id));
}
function prog(){
  const all=[...V.major.courses,...V.major.electives],ids=new Set(all.map(x=>x.id));
  const dn=all.filter(x=>V.done.includes(x.id));
  return{n:dn.length,total:ids.size,pct:ids.size?Math.round(dn.length/ids.size*100):0,hrs:dn.reduce((a,x)=>a+(x.h??3),0)};
}
const byYear=m=>{const a=Array.from({length:m.years},()=>[]);m.courses.forEach(c=>a[Math.min(m.years,Math.max(1,c.y))-1].push(c));return a};

/* ===== 6) الأوضاع الأربعة: شجرة / عمارة / بحر / خطة ===== */
function itemAttrs(c,cls){
  const s=stOf(c);
  return `class="${cls} n-${s}" data-id="${esc(c.id)}" aria-pressed="${s==='done'}"${s==='lock'?' aria-disabled="true"':''}`;
}
function eAttrs(e,cls){
  const d=V.done.includes(e.id);
  return `class="${cls} n-${d?'done':'open'}" data-id="${esc(e.id)}" aria-pressed="${d}"`;
}
const emptyYear=()=>`<p class="empty">${esc(t('noCourses'))}</p>`;
const codeName=c=>`<span class="fc">${esc(c.id)}</span><span class="fn">${esc(nm(c))}</span>`;

/* --- الشجرة: الأغصان = السنوات، الثمار = المواد --- */
function treeHTML(m){
  const yrs=byYear(m);let rows='';
  for(let y=m.years;y>=1;y--){
    const list=yrs[y-1];
    rows+=`<section class="lr ${y%2?'L':'R'}"><div class="cell"><div class="limb"></div><span class="ytag">${esc(t('yr',y))}</span>
      <div class="canopy">${list.length?list.map(c=>`<button ${itemAttrs(c,'fr')}><span class="fruit">${V.done.includes(c.id)?'✓':''}</span>${codeName(c)}</button>`).join(''):emptyYear()}</div></div></section>`;
  }
  const el=m.electives.length
    ?`<div class="grass"><h3>🍂 ${esc(t('electives'))}</h3><p>${esc(t('electivesSub'))}</p><div class="fallen">${m.electives.map(e=>`<button ${eAttrs(e,'pill')}><i class="dot"></i>${esc(nm(e))}</button>`).join('')}</div></div>`
    :'<div class="grass thin"></div>';
  return `<div class="scene tree"><div class="crown"><span>🎓</span></div><div class="tr-rows"><div class="trunk"></div>${rows}</div><div class="tr-base"></div>${el}</div>`;
}

function seaHTML(m){

/* --- الخلية: كل سنة طبقة (من الغشاء للنواة)، والمواد عُضيّات وبروتينات --- */
function layerKeys(n){
  const base=n>=5?['mem','cyt','er','mito','nuc']:{1:['nuc'],2:['cyt','nuc'],3:['mem','cyt','nuc'],4:['mem','cyt','mito','nuc']}[n];
  return base.concat(['nucl','dna','chr'].slice(0,Math.max(0,n-5)));
}
function cellHTML(m){
  const yrs=byYear(m),keys=layerKeys(m.years),L=t('layers');
  const build=i=>{
    if(i>=m.years)return '';
    const k=keys[i],list=yrs[i];
    return `<div class="cl cl-${k}"><h3>${esc(t('yr',i+1))} · ${esc(L[k])}</h3><div class="ogs">${list.length?list.map((c,j)=>`<button style="--d:-${((j*7)%11)*.3}s" ${itemAttrs(c,'ogb')}><span class="og og-${k}">${V.done.includes(c.id)?'✓':''}</span>${codeName(c)}</button>`).join(''):emptyYear()}</div>${build(i+1)}</div>`;
  };
  const el=m.electives.length
    ?`<div class="exo"><h3>🫧 ${esc(t('elCell'))}</h3><p>${esc(t('electivesSub'))}</p><div class="fallen">${m.electives.map(e=>`<button ${eAttrs(e,'pill')}><i class="dot"></i>${esc(nm(e))}</button>`).join('')}</div></div>`:'<div class="exo thin"></div>';
  return `<div class="scene bio"><div class="bio-in">${build(0)}</div>${el}</div>`;

/* --- الحاسوب: كل سنة مسار على اللوحة الأم، والمواد شرائح --- */

function pcHTML(m){

/* --- الدارة (BioCircuit): شبكة عقد، الخطوط = المتطلبات، والكهرباء بتمشي لما تنجز --- */
const YC=['#ffd166','#9bb0a8','#4cc9f0','#b388ff','#ff6bd6','#27f5a0','#ff9f43','#f87171'],YI=['🧮','🛠️','⚡','💾','🧠','🤖','🔬','🧬'];
function graphHTML(m){
  const B=V.byId,lvl={};
  const lv=id=>{if(lvl[id]!==undefined)return lvl[id];lvl[id]=0;const ps=B[id].pre.filter(p=>B[p]);return lvl[id]=ps.length?1+Math.max(...ps.map(lv)):0};
  const node=(x,attrs,color,ico)=>`<button style="--c:${color}" ${attrs}><span class="orb"><i class="ck">✔</i><b>${ico}</b></span><span class="lb"><em>${esc(x.id)}</em>${esc(nm(x))}</span></button>`;
  const bands=byYear(m).map((list,i)=>{
    const c=YC[i%8],ic=YI[i%8],dn=list.filter(x=>V.done.includes(x.id)).length;
    const sorted=[...list].sort((a,b)=>lv(a.id)-lv(b.id)||a.id.localeCompare(b.id));
    return `<section class="gband" style="--c:${c}"><div class="gb-h"><span class="gb-y"><b>${ic}</b>${esc(t('yr',i+1))}</span><span class="gb-p">${dn}/${list.length}</span></div><div class="gb-n">${sorted.length?sorted.map(x=>node(x,itemAttrs(x,'gnd'),c,ic)).join(''):emptyYear()}</div></section>`;
  }).join('');
  const el=m.electives.length?`<section class="gband" style="--c:#ff9f43"><div class="gb-h"><span class="gb-y"><b>🧬</b>${esc(t('electives'))}</span></div><div class="gb-n">${m.electives.map(e=>node(e,eAttrs(e,'gnd el'),'#ff9f43','🧬')).join('')}</div></section>`:'';
  return `<div class="scene gr"><div class="gr-in" id="gri"><svg class="gr-w" id="grw" aria-hidden="true"></svg>${bands}${el}</div></div>`;
}
// أسلاك الدارة: بتنقاس من مواقع العقد الفعلية فبتتكيّف مع أي عرض شاشة بدون سكرول داخلي
function gwires(){
  const w=$('grw'),box=$('gri');if(!w||!box||!V)return;
  const r=box.getBoundingClientRect(),els={};
  box.querySelectorAll('.gnd[data-id]').forEach(e=>{els[e.dataset.id]=e.querySelector('.orb')});

    const dy=y2-y1,k=Math.max(36,Math.abs(dy)*.5),sg=dy<0?-1:1;
    const d=Math.abs(dy)<10?`M${x1} ${y1}Q${(x1+x2)/2} ${y1-48} ${x2} ${y2}`:`M${x1} ${y1}C${x1} ${y1+sg*k},${x2} ${y2-sg*k},${x2} ${y2}`;

// رسم خطوط الربط بين المادة ومتطلباتها (أخضر = مكتمل، منقط = جاهز، رمادي = مقفل)
function lines(){
  const svg=$('svg'),vp=$('vp');if(!svg||!vp||!V)return;
  const r=vp.getBoundingClientRect(),rtl=lang==='ar';
  svg.setAttribute('viewBox',`0 0 ${r.width} ${r.height}`);svg.innerHTML='';
  const els={};vp.querySelectorAll('[data-id]').forEach(e=>{els[e.dataset.id]=e});
  V.major.courses.forEach(tc=>tc.pre.forEach(sid=>{
    const a=els[sid],b=els[tc.id];if(!a||!b)return;
    const A=a.getBoundingClientRect(),B=b.getBoundingClientRect(),s=rtl?-1:1;
    const y1=A.top+A.height/2-r.top,y2=B.top+B.height/2-r.top;let d;
    if(a.parentNode===b.parentNode){
      const x=(rtl?A.left:A.right)-r.left;
      d=`M${x} ${y1} C${x+s*22} ${y1},${x+s*22} ${y2},${x} ${y2}`;
    }else{
      const x1=(rtl?A.left:A.right)-r.left,x2=(rtl?B.right:B.left)-r.left,k=Math.abs(x2-x1)*.5;
      d=`M${x1} ${y1} C${x1+s*k} ${y1},${x2-s*k} ${y2},${x2} ${y2}`;
    }
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',d);
    const sd=V.done.includes(sid),td=V.done.includes(tc.id);
    p.setAttribute('class',sd&&td?'active':sd?'ready':'');
    svg.appendChild(p);
  }));
}

let hoverId=null,tipTimer;
function showTip(el){
  const tip=$('tip'),id=el.dataset.id,c=V.byId[id],x=c||V.eById[id];if(!x)return;
  let h=`<div class="tn">${esc(nm(x))}</div>`;
  if(c){
    h+=`<div class="tc">${esc(c.id)} · ${esc(t('hrsTip',c.h??3))}</div>`;
    const pre=c.pre.filter(p=>V.byId[p]);
    if(pre.length)h+=`<div class="tp">${esc(t('prereq'))}<br>${pre.map(p=>{const ok=V.done.includes(p);return `<span class="${ok?'ok':'no'}">${ok?'✓':'✗'} ${esc(nm(V.byId[p]))}</span>`}).join('<br>')}</div>`;
  }
  h+=`<div class="th">${esc(c&&stOf(c)==='lock'?t('tipLock'):V.done.includes(id)?t('tipUndo'):t('tipDo'))}</div>`;
  tip.innerHTML=h;tip.classList.add('on');
  const r=el.getBoundingClientRect(),w=tip.offsetWidth,hh=tip.offsetHeight;
  const left=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2));
  let top=r.top-hh-10;if(top<8)top=r.bottom+10;
  tip.style.left=left+'px';tip.style.top=top+'px';
}
function hover(el){
  const id=el?el.dataset.id:null;
  if(id===hoverId)return;
  unhover();if(!id)return;hoverId=id;showTip(el);
  // على شاشات اللمس ما في mouseleave، فبنخفي التلميح تلقائياً
  if(matchMedia('(hover:none)').matches){clearTimeout(tipTimer);tipTimer=setTimeout(unhover,1800)}
  const c=V.byId[id];if(!c)return;
  const st=$('stage'),mark=(ids,cls)=>ids.forEach(i=>st.querySelectorAll(`[data-id="${CSS.escape(i)}"]`).forEach(e=>e.classList.add(cls)));
  mark(c.pre,'hl-pre');mark(kids(id),'hl-dep');
  if(mode==='graph')st.querySelectorAll(`.ge,.gf`).forEach(e=>{if(e.dataset.s===id||e.dataset.t===id)e.classList.add('hl')});
}
function unhover(){
  hoverId=null;const tip=$('tip');if(tip)tip.classList.remove('on');
  document.querySelectorAll('.hl-pre,.hl-dep,.ge.hl,.gf.hl').forEach(e=>e.classList.remove('hl-pre','hl-dep','hl'));
}

/* ===== 9) تأثيرات الحركة عند الإنجاز ===== */
const BURST={graph:['⚡','✦','•'],tree:['🍃','🌿','✨'],building:['✨','💡'],sea:['bub'],cell:['⚡','✦','•'],pc:['bit0','bit1','⚡'],classic:['✨']};
function fx(id,cls,unlock){
  const st=$('stage');if(!st)return;
  const q=i=>st.querySelector(`[data-id="${CSS.escape(i)}"]`),el=q(id);
  if(el){el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),1000);if(cls==='fx-on')burst(el)}
  if(mode==='graph')st.querySelectorAll(`.gf[data-s="${CSS.escape(id)}"]`).forEach(e=>e.classList.add('zap'));
  unlock.forEach(i=>{const u=q(i);if(u){u.classList.add('fx-unlock');setTimeout(()=>u.classList.remove('fx-unlock'),1500)}});
}
function burst(el){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const ic=el.querySelector('.fruit,.fsh,.og,.orb')||el,r=ic.getBoundingClientRect();
  const cx=r.left+r.width/2,cy=r.top+r.height/2,k=BURST[mode]||BURST.tree,n=11;
  for(let i=0;i<n;i++){
    const sp=document.createElement('span'),a=Math.PI*2*i/n+Math.random()*.5,d=36+Math.random()*46,sym=k[i%k.length];
    sp.className='fxp'+(sym==='bub'?' bub':sym.startsWith('bit')?' bit':'');
    sp.textContent=sym==='bub'?'':sym.startsWith('bit')?sym.slice(3):sym;
    sp.style.cssText=`left:${cx}px;top:${cy}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-20}px`;
    document.body.appendChild(sp);setTimeout(()=>sp.remove(),1050);
  }
}

function crsList(m){

function courseForm(id){
  const m=curMajor(),c=id?m.courses.find(x=>x.id===id):null;
  const sel=new Set(c?c.pre:[]);
  const others=m.courses.filter(x=>x.id!==id);
  const pre=others.length?`<div class="pre-list" id="prelist">${others.map(x=>`<label class="pre-i" data-s="${esc((x.id+' '+x.ar+' '+x.en).toLowerCase())}"><input type="checkbox" name="pre" value="${esc(x.id)}"${sel.has(x.id)?' checked':''}><span><b>${esc(x.id)}</b> ${esc(nm(x))}</span></label>`).join('')}</div>`:`<p class="mu">—</p>`;
  const years=Array.from({length:m.years},(_,i)=>`<option value="${i+1}"${c&&c.y===i+1?' selected':''}>${esc(t('yr',i+1))}</option>`).join('');
  openDlg(`<h2>${esc(c?t('editCourse'):t('addCourse'))}</h2>
    ${fld('f_id',t('cCode'),`<input id="f_id" name="id" value="${esc(c&&c.id)}" maxlength="24" dir="ltr"${c?' readonly':''} required>`,t('cCodeHint'))}
    ${fld('f_yr',t('cYear'),`<select id="f_yr" name="y">${years}</select>`)}
    ${nameFields(c,'cAr','cEn')}
    ${fld('f_h',t('cHours'),`<input id="f_h" name="h" type="number" min="0" max="12" value="${c?(c.h??3):3}">`)}
    <div class="fld"><label>${esc(t('cPre'))}</label>${others.length>8?`<input type="search" data-inp="preq" placeholder="${esc(t('search'))}" aria-label="${esc(t('search'))}">`:''}${pre}</div>`,f=>{
    const code=f.elements.id.value.trim(),ar=f.elements.ar.value.trim(),en=f.elements.en.value.trim(),y=parseInt(f.elements.y.value);
    if(!c){
      if(!/^[A-Za-z0-9._-]{1,24}$/.test(code)||/^e_/i.test(code))return t('errCode');
      if(m.courses.some(x=>x.id===code))return t('errCodeUsed');
    }
    if(!ar&&!en)return t('errNeedName');
    const h=parseInt(f.elements.h.value);if(!(h>=0&&h<=12))return t('errHours');
    const picked=[...f.querySelectorAll('input[name=pre]:checked')].map(i=>i.value);
    if(c)for(const p of picked)if(dependsOn(m,p,c.id))return t('errCycle',nm(m.courses.find(x=>x.id===p)));
    if(c)Object.assign(c,{y,h,ar,en,pre:picked});
    else m.courses.push({id:code,y,h,ar,en,pre:picked});
    saveDB();refresh();
  });
}
// هل المادة start بتعتمد (مباشرة أو بشكل غير مباشر) على المادة target؟
function dependsOn(m,start,target){
  const seen=new Set(),st=[start];
  while(st.length){
    const id=st.pop();if(id===target)return true;if(seen.has(id))continue;seen.add(id);
    const c=m.courses.find(x=>x.id===id);if(c)c.pre.forEach(p=>st.push(p));
  }
  return false;
}

    if(!ar&&!en)return t('errNeedName');

const csvCell=v=>{v=String(v??'');if(/^[=+\-@]/.test(v))v="'"+v;return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function studentsCsv(){

  unhover();V=null;
  if(SES&&SES.role==='admin'){
    const m=PREVIEW&&majorOf(PREVIEW);
    if(m){startViewer(m,PDONE,()=>{PDONE=V.done},{preview:true});viewerShell();return}
    PREVIEW=null;adminShell();return;
  }
  if(SES&&SES.role==='student'){
    const u=USERS.find(x=>x.sid===SES.sid);
    if(!u){SES=null;ls.set('aum2_ses',null);return go()}
    const m=majorOf(u.majorId);
    if(!m){pickMajorScreen(u);return}
    startViewer(m,u.done,()=>{u.done=V.done;saveUsers()},{user:u});viewerShell();return;
  }
  $('app').innerHTML=authHTML();
}
async function boot(){
  // لو في ملف data.json بجانب index.html (بعد ما المدير يصدّره) بنستعمله إذا كان أحدث
  try{
    const r=await Promise.race([fetch('data.json',{cache:'no-store'}),new Promise((_,j)=>setTimeout(j,1200))]);
    if(r&&r.ok){const d=await r.json();if(d&&Array.isArray(d.majors)){const s=sanitize(d);if(s.rev>(DB.rev||0)&&s.majors.length)DB=s}}
  }catch(e){}
  go();
}
boot();
</script>
